  # --- Career pages with no public API, read through Firecrawl ---
  # Each entry costs about 1 Firecrawl credit per run (2 runs a day, so ~60 credits a month),
  # plus 4 more on runs where the page changed and has no plain internship links.
  # The free tier (1,000 credits a month) fits roughly 10 to 12 of these next to discovery.
  # `location` is assumed for listings that don't state one.
  # Pages that list no internships after a few runs should be removed to save credits.
  - {name: Google, ats: careerpage, url: "https://www.google.com/about/careers/applications/jobs/results?q=intern&location=India&target_level=INTERN_AND_APPRENTICE", location: "India", tags: [big-tech]}
  - {name: Meta, ats: careerpage, url: "https://www.metacareers.com/jobs?roles[0]=Internship", tags: [big-tech]}
  - {name: Microsoft, ats: careerpage, url: "https://jobs.careers.microsoft.com/global/en/search?q=intern&lc=India", location: "India", tags: [big-tech]}
  - {name: Apple, ats: careerpage, url: "https://jobs.apple.com/en-in/search?team=internships-STDNT-INTRN", location: "India", tags: [big-tech]}
  - {name: Pune Startups (job board), ats: careerpage, url: "https://jobs.punestartups.org/", location: "Pune, India", tags: [pune, startup]}
  - {name: Built In Pune (job board), ats: careerpage, url: "https://builtinpune.in/jobs", location: "Pune, India", tags: [pune, startup]}
