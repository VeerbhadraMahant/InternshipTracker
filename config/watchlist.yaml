# Companies polled directly on their own hiring system, plus remote job feeds.
#
# How to find a company's slug:
#   greenhouse       boards.greenhouse.io/<slug>        or job-boards.greenhouse.io/<slug>
#   lever            jobs.lever.co/<slug>
#   ashby            jobs.ashbyhq.com/<slug>
#   smartrecruiters  jobs.smartrecruiters.com/<slug>
#   workday          https://<host>/<site>  e.g. nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#                    -> host: nvidia.wd5.myworkdayjobs.com, slug (tenant): nvidia, site: NVIDIAExternalCareerSite
#
# A wrong slug shows up as a failing source in the dashboard's Source health panel
# and in the Actions log. After the first live run (Sept 2026) every entry below
# answered; PhonePe and Postman (404) and Visa (empty board) were removed.
# Tags are free-form and shown on the dashboard.

companies:
  # --- Workday: MNCs with Pune / Mumbai engineering centres ---
  - {name: NVIDIA, ats: workday, host: nvidia.wd5.myworkdayjobs.com, slug: nvidia, site: NVIDIAExternalCareerSite, tags: [pune, ai]}
  - {name: Mastercard, ats: workday, host: mastercard.wd1.myworkdayjobs.com, slug: mastercard, site: CorporateCareers, tags: [pune]}
  - {name: Barclays, ats: workday, host: barclays.wd3.myworkdayjobs.com, slug: barclays, site: External_Career_Site_Barclays, tags: [pune]}
  - {name: Deutsche Bank, ats: workday, host: db.wd3.myworkdayjobs.com, slug: db, site: DBWebsite, tags: [pune, mumbai]}
  - {name: Salesforce, ats: workday, host: salesforce.wd12.myworkdayjobs.com, slug: salesforce, site: External_Career_Site, tags: [mumbai]}
  - {name: Adobe, ats: workday, host: adobe.wd5.myworkdayjobs.com, slug: adobe, site: external_experienced, tags: [india]}

  # --- SmartRecruiters ---
  - {name: Bosch, ats: smartrecruiters, slug: BoschGroup, tags: [pune]}
  - {name: ServiceNow, ats: smartrecruiters, slug: ServiceNow, tags: [india]}

  # --- Greenhouse: India engineering or remote-friendly ---
  - {name: Druva, ats: greenhouse, slug: druva, tags: [pune]}
  - {name: Databricks, ats: greenhouse, slug: databricks, tags: [ai]}
  - {name: Cloudflare, ats: greenhouse, slug: cloudflare, tags: []}
  - {name: GitLab, ats: greenhouse, slug: gitlab, tags: [remote-first]}
  - {name: Stripe, ats: greenhouse, slug: stripe, tags: []}
  - {name: Anthropic, ats: greenhouse, slug: anthropic, tags: [ai]}
  - {name: Scale AI, ats: greenhouse, slug: scaleai, tags: [ai]}
  - {name: MongoDB, ats: greenhouse, slug: mongodb, tags: []}
  - {name: Grafana Labs, ats: greenhouse, slug: grafanalabs, tags: [remote-first]}
  - {name: Coinbase, ats: greenhouse, slug: coinbase, tags: [remote-first]}

  # --- Lever ---
  - {name: CRED, ats: lever, slug: cred, tags: [india]}
  - {name: Zeta, ats: lever, slug: zeta, tags: [india]}
  - {name: Palantir, ats: lever, slug: palantir, tags: []}

  # --- Ashby ---
  - {name: OpenAI, ats: ashby, slug: openai, tags: [ai]}
  - {name: Supabase, ats: ashby, slug: supabase, tags: [remote-first]}
  - {name: PostHog, ats: ashby, slug: posthog, tags: [remote-first]}
  - {name: Linear, ats: ashby, slug: linear, tags: [remote-first]}
  - {name: Ramp, ats: ashby, slug: ramp, tags: []}

  # --- Career pages with no public API, read through Firecrawl ---
  # Each entry costs about 1 Firecrawl credit per run (2 runs a day, so ~60 credits a month),
  # plus 4 more on runs where the page changed and has no plain internship links.
  # The free tier (1,000 credits a month) fits roughly 10 to 12 of these next to discovery.
  # `location` is assumed for listings that don't state one.
  # - {name: Example Co, ats: careerpage, url: "https://careers.example.com/jobs", location: "Pune, India", tags: [pune]}

feeds:
  remoteok: {}
  remotive:
    categories: [software-dev, data]
    min_interval_hours: 6        # Remotive asks API users to poll a few times a day at most
  weworkremotely:
    categories: [remote-programming-jobs, remote-full-stack-programming-jobs, remote-back-end-programming-jobs]
  hn-whoishiring:
    min_interval_hours: 24       # one thread per month; no need to hammer it

# Weekly Firecrawl search for more companies (Discover workflow, python -m tracker.discover).
# Cost: 2 credits per 10 results, so 8 queries x 20 results = 32 credits a week.
# New boards are checked against their free API and written to config/discovered.yaml.
discovery:
  results_per_query: 20
  max_new_per_run: 25
  queries:
    - "site:jobs.lever.co intern India"
    - "site:job-boards.greenhouse.io intern India"
    - "site:boards.greenhouse.io intern Pune OR Mumbai"
    - "site:jobs.ashbyhq.com intern India"
    - "site:myworkdayjobs.com intern Pune"
    - "site:myworkdayjobs.com intern Mumbai"
    - "site:jobs.smartrecruiters.com intern Pune OR Mumbai"
    - "site:jobs.ashbyhq.com OR site:jobs.lever.co software intern remote India"
