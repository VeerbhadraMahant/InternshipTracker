name: Pages

# Pushes made by the Scrape workflow's GITHUB_TOKEN don't trigger `push` workflows,
# so deploys also run after every Scrape run.
on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Scrape]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp web/* _site/
          cp data/*.json _site/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
