name: Deploy

# Publishes the dashboard to Cloudflare Workers.
# Pushes made by the Scrape workflow's GITHUB_TOKEN don't trigger `push` workflows,
# so this also runs after every Scrape run to ship the fresh data.
on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "scripts/build_site.sh", "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_run:
    workflows: [Scrape]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # after a Scrape run, pick up the data commit it just pushed

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
