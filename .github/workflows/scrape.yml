name: Scrape

on:
  schedule:
    - cron: "17 */12 * * *"  # 00:17 and 12:17 UTC (05:47 and 17:47 IST), off the top of the hour
  workflow_dispatch:
    inputs:
      seed:
        description: "Record current roles as seen without sending alerts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, classify, alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}           # career pages; skipped if unset
          FIRECRAWL_MONTHLY_BUDGET: ${{ vars.FIRECRAWL_MONTHLY_BUDGET || '900' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}   # e.g. https://internship-tracker.<you>.workers.dev
        run: python -m tracker.run ${{ inputs.seed && '--seed' || '' }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "internship-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"; exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

